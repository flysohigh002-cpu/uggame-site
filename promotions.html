<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.pm-tab')),
      cards=[].slice.call(document.querySelectorAll('.pm-card')),
      empty=document.getElementById('pmEmpty');
  function filter(f){
    var n=0;
    cards.forEach(function(c){
      var show=f==='all'||(' '+c.dataset.cat+' ').indexOf(' '+f+' ')>-1;
      c.hidden=!show; if(show)n++;
    });
    empty.hidden=n>0;
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.f===f?'true':'false');});
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){filter(t.dataset.f);window.scrollTo({top:0,behavior:'smooth'});});});

  /* 返回鈕：有上一頁就回上一頁，新分頁直接開啟時回首頁 */
  document.getElementById('pmBack').addEventListener('click',function(e){
    if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){e.preventDefault();history.back();}
  });

  /* 從首頁輪播點進來：捲到對應那張（CSS :target 會閃一下外框） */
  if(location.hash){
    var t=document.getElementById(location.hash.slice(1));
    if(t)setTimeout(function(){t.scrollIntoView({block:'center'});},60);
  }
})();
</script>
